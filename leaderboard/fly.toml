app = "airshift-leaderboard-freakme83"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  LEADERBOARD_DB_PATH = "/data/leaderboard.sqlite"
  LEADERBOARD_TRUST_FLY_CLIENT_IP = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[mounts]]
  source = "leaderboard_data"
  destination = "/data"
